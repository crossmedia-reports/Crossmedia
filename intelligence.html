<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligence Platform - Crossmedia</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #e6f0fa;
    color: #333;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}
.container {
    background: white;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 90, 180, 0.1);
    width: 100%;
    max-width: 460px;
    text-align: center;
}
.logo-box { margin-bottom: 25px; }
.logo-box img { max-width: 220px; height: auto; }
h1 { font-size: 1.4rem; color: #1e3a5f; margin: 0 0 10px 0; font-weight: 700; }
p { color: #607d8b; font-size: 0.95rem; margin: 0 0 25px 0; }
input[type="password"] {
    width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #cfd8dc;
    border-radius: 6px; font-size: 1rem; box-sizing: border-box; outline: none;
    transition: border-color 0.2s;
}
input[type="password"]:focus { border-color: #ff6d00; }
button {
    background-color: #ff6d00; color: white; border: none; padding: 14px 20px;
    font-size: 1rem; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;
    transition: background-color 0.2s, transform 0.1s;
}
button:hover { background-color: #e65100; }
button:active { transform: scale(0.98); }
.error { color: #d32f2f; margin-top: 15px; font-size: 0.9rem; font-weight: 500; display: none; }
#protected-content { display: none; }
.unlocked-body { display: block !important; background-color: transparent !important; padding: 0 !important; }
.unlocked-container { max-width: 100% !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
.report-list { text-align: left; }
.report-list h2 { font-size: 1.1rem; color: #1e3a5f; margin: 0 0 14px; }
.report-list a {
    display: block; padding: 14px 16px; margin-bottom: 10px; border: 2px solid #e6f0fa;
    border-radius: 8px; color: #1e3a5f; text-decoration: none; font-weight: 600;
    transition: border-color .15s, background-color .15s;
}
.report-list a:hover { border-color: #ff6d00; background-color: #fff6ef; }
.report-list .client-name { color: #ff6d00; font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 14px; display: block; }
</style>
</head>

    function handleKeyPress(e) {
        if (e.keyCode === 13) { unlockContent(); }
    }

    function unlockContent() {
        const password = document.getElementById('password-input').value;
        const errorMsg = document.getElementById('error-msg');
        const client = CLIENTS[password];

        if (client) {
            document.getElementById('login-zone').remove();
            document.body.classList.add('unlocked-body');
            document.getElementById('main-container').classList.add('unlocked-container');
            const contentDiv = document.getElementById('protected-content');
            contentDiv.style.display = 'block';

            if (client.mode === 'embed') {
                try {
                    const reversed = client.data.split("").reverse().join("");
                    const decoded = decodeURIComponent(escape(atob(reversed)));
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '100%';
                    iframe.style.height = '100vh';
                    iframe.style.border = 'none';
                    contentDiv.appendChild(iframe);
                    const idoc = iframe.contentWindow.document;
                    idoc.open(); idoc.write(decoded); idoc.close();
                } catch (err) {
                    contentDiv.innerHTML = '<p style="padding:40px;text-align:center;color:#d32f2f">Eroare la afisarea raportului.</p>';
                }
            } else if (client.mode === 'links') {
                let html = '<div class="report-list" style="max-width:520px;margin:60px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 10px 25px rgba(0,90,180,0.1)">';
                html += '<span class="client-name">' + client.name + '</span>';
                html += '<h2>Rapoartele voastre</h2>';
                client.links.forEach(function(l) {
                    html += '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + ' &#8599;</a>';
                });
                html += '</div>';
                contentDiv.innerHTML = html;
            }
        } else {
            errorMsg.style.display = 'block';
        }
    }
</script>
